<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco Vidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby-screen">
        <div class="login-box">
            <h1>TRUCO VIDAS</h1>
            <div class="avatar-grid" id="avatar-selection">
                <img src="avatares/avatars/adam.jpg" class="avatar-option selected">
                <img src="avatares/avatars/alanzoka.jpg" class="avatar-option selected">
                <img src="avatares/avatars/badfallen.jpg" class="avatar-option selected">
                <img src="avatares/avatars/bolsolula.jpg" class="avatar-option selected">
                <img src="avatares/avatars/bozo.jpg" class="avatar-option selected">
                <img src="avatares/avatars/burro.jpg" class="avatar-option selected">
                <img src="avatares/avatars/careca.jpg" class="avatar-option selected">
                <img src="avatares/avatars/cris.jpg" class="avatar-option selected">
                <img src="avatares/avatars/fallen.jpg" class="avatar-option selected">
                <img src="avatares/avatars/fallencalvo.jpg" class="avatar-option selected">
                <img src="avatares/avatars/gaumagro.jpg" class="avatar-option selected">
                <img src="avatares/avatars/girafa.jpg" class="avatar-option selected">
                <img src="avatares/avatars/hmm.jpg" class="avatar-option selected">
                <img src="avatares/avatars/julius.jpg" class="avatar-option selected">
                <img src="avatares/avatars/lula.jpg" class="avatar-option selected">
                <img src="avatares/avatars/madruga.jpg" class="avatar-option selected">
                <img src="avatares/avatars/michael.jpg" class="avatar-option selected">
                <img src="avatares/avatars/molodoy.jpg" class="avatar-option selected">
                <img src="avatares/avatars/nerd.jpg" class="avatar-option selected">
                <img src="avatares/avatars/peixe.jpg" class="avatar-option selected">
                <img src="avatares/avatars/serjao.jpg" class="avatar-option selected">
                <img src="avatares/avatars/sextou.jpg" class="avatar-option selected">
                <img src="avatares/avatars/shrek.jpg" class="avatar-option selected">
                <img src="avatares/avatars/silvao.jpg" class="avatar-option selected">
                <img src="avatares/avatars/simplao.jpg" class="avatar-option selected">
                <img src="avatares/avatars/simple.jpg" class="avatar-option selected">
                <img src="avatares/avatars/simples.jpg" class="avatar-option selected">
                <img src="avatares/avatars/somelier.jpg" class="avatar-option selected">
                <img src="avatares/avatars/superbozo.jpg" class="avatar-option selected">
                <img src="avatares/avatars/taco.jpg" class="avatar-option selected">
                <img src="avatares/avatars/zywoo.jpg" class="avatar-option selected">
                <img src="avatares/avatars/douglas.jpg" class="avatar-option selected">
                <img src="avatares/avatars/thiago.jpg" class="avatar-option selected">
                <img src="avatares/avatars/ricardo.jpg" class="avatar-option selected">
                <img src="avatares/avatars/diogenes.jpg" class="avatar-option selected">
                <img src="avatares/avatars/marquinho.jpg" class="avatar-option selected">
                <img src="avatares/avatars/rony.jpg" class="avatar-option selected">
                <img src="avatares/avatars/ortola.jpg" class="avatar-option selected">

            </div>
            <input type="text" id="username" placeholder="Seu Apelido" maxlength="25">
            <button onclick="joinGame()" class="btn-primary">ENTRAR</button>
        </div>
        <div id="waiting-area" style="display:none;">
            <h2>Sala de Espera</h2>
            <div id="players-list"></div>
            <button id="btn-ready" onclick="toggleReady()" class="btn-secondary">PRONTO?</button>
        </div>
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; flex-direction:column; align-items:center; justify-content:center; color:white;">
        <h1 style="font-size: 3em; color: gold;">FIM DE JOGO</h1>
        <h2 id="winner-name"></h2>
        <br>
        <button onclick="requestRestart()" class="btn-primary" style="width: 200px; font-size: 1.2em;">JOGAR NOVAMENTE</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div id="turn-notification" class="notification">Aguardando...</div>

        <div class="table-felt" id="table-container">
            <div class="center-area"><div id="vira-slot"></div></div>
        </div>
        
        <div id="my-hud">
            <div id="bet-controls" style="display:none;">
                <p>Quantas você faz?</p>
                <div id="bet-options" class="bet-buttons-container"></div>
            </div>

            <div id="my-info-bar">
                <span id="my-lives"></span> | 
                <span id="my-bet-status"></span>
            </div>
            <div id="my-hand"></div>
        </div>
    </div>

    <div id="credits">by JotaVe1</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
