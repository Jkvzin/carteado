<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco Vidas</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<body>
    <div id="lobby-screen">
        <div class="login-box">
            <h1>CARTEADO</h1>
            <div class="avatar-grid" id="avatar-selection">
                <img src="avatares/adam.jpg" class="avatar-option selected">
                <img src="avatares/alanzoka.jpg" class="avatar-option">
                <img src="avatares/badfallen.jpg" class="avatar-option">
                <img src="avatares/bolsolula.jpg" class="avatar-option">
                <img src="avatares/bozo.jpg" class="avatar-option">
                <img src="avatares/burro.jpg" class="avatar-option">
                <img src="avatares/careca.jpg" class="avatar-option">
                <img src="avatares/cris.jpg" class="avatar-option">
                <img src="avatares/fallen.jpg" class="avatar-option">
                <img src="avatares/fallencalvo.jpg" class="avatar-option">
                <img src="avatares/gaumagro.jpg" class="avatar-option">
                <img src="avatares/girafa.jpg" class="avatar-option">
                <img src="avatares/hmm.jpg" class="avatar-option">
                <img src="avatares/julius.jpg" class="avatar-option">
                <img src="avatares/lula.jpg" class="avatar-option">
                <img src="avatares/madruga.jpg" class="avatar-option">
                <img src="avatares/michael.jpg" class="avatar-option">
                <img src="avatares/molodoy.jpg" class="avatar-option">
                <img src="avatares/nerd.jpg" class="avatar-option">
                <img src="avatares/peixe.jpg" class="avatar-option">
                <img src="avatares/serjao.jpg" class="avatar-option">
                <img src="avatares/sextou.jpg" class="avatar-option">
                <img src="avatares/shrek.jpg" class="avatar-option">
                <img src="avatares/silvao.jpg" class="avatar-option">
                <img src="avatares/simplao.jpg" class="avatar-option">
                <img src="avatares/simple.jpg" class="avatar-option">
                <img src="avatares/simples.jpg" class="avatar-option">
                <img src="avatares/somelier.jpg" class="avatar-option">
                <img src="avatares/superbozo.jpg" class="avatar-option">
                <img src="avatares/taco.jpg" class="avatar-option">
                <img src="avatares/zywoo.jpg" class="avatar-option">
                <img src="avatares/douglas.jpg" class="avatar-option">
                <img src="avatares/thiago.jpg" class="avatar-option">
                <img src="avatares/ricardo.jpg" class="avatar-option">
                <img src="avatares/diogenes.jpg" class="avatar-option">
                <img src="avatares/marquinho.jpg" class="avatar-option">
                <img src="avatares/rony.jpg" class="avatar-option">
                <img src="avatares/ortola.jpg" class="avatar-option">

            </div>
            <input type="text" id="username" placeholder="Seu Apelido" maxlength="25">
            <button onclick="joinGame()" class="btn-primary">ENTRAR</button>
        </div>
        <div id="waiting-area" style="display:none;">
            <h2>Sala de Espera</h2>
            <div id="players-list"></div>
            <button id="btn-ready" onclick="toggleReady()" class="btn-secondary">PRONTO?</button>
        </div>
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; flex-direction:column; align-items:center; justify-content:center; color:white; text-align:center;">
        
        <h1 style="font-size: 4em; color: gold; text-shadow: 0 0 20px orange; margin-bottom: 20px;">🏆 CAMPEÃO 🏆</h1>
        
        <img id="winner-avatar" src="" style="width: 200px; height: 200px; border-radius: 50%; border: 5px solid gold; box-shadow: 0 0 50px gold; margin-bottom: 20px;">
        
        <h2 id="winner-name" style="font-size: 3em; margin: 0;"></h2>
        
        <h3 style="font-size: 1.5em; color: #ccc; margin-top: 10px;">É O MELHOR DE TODOS!</h3>
        
        <br><br>
        <button onclick="requestRestart()" class="btn-primary" style="width: 250px; font-size: 1.2em; animation: pulse 1s infinite;">JOGAR NOVAMENTE</button>
    </div>

    <div id="music-control" onclick="toggleMusic()" style="position:fixed; bottom:15px; left:15px; z-index:5000; cursor:pointer; opacity:0.7; font-size:24px;">
        🔈 </div>

    <audio id="bg-music" loop>
        <source src="sounds/background.mp3" type="audio/mpeg">
    </audio>

    <audio id="victory-music">
        <source src="sounds/victory.mp3" type="audio/mpeg">
    </audio>

    <div id="game-screen" style="display:none;">
        <div id="turn-notification" class="notification">Aguardando...</div>

        <div class="table-felt" id="table-container">
            <div class="center-area"><div id="vira-slot"></div></div>
        </div>
        
        <div id="my-hud">
            <div id="bet-controls" style="display:none;">
                <p>Quantas você faz?</p>
                <div id="bet-options" class="bet-buttons-container"></div>
            </div>

            <div id="my-info-bar">
                <span id="my-lives"></span> | 
                <span id="my-bet-status"></span>
            </div>
            <div id="my-hand"></div>
        </div>
    </div>

    <div id="credits">by JotaVe1</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
